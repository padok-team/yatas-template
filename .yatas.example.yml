plugins:
  - name: "template"
    enabled: true
    source: "github.com/padok-team/yatas-template"
    version: "local"

pluginsConfiguration:
  - pluginName: "template"
    # Each entry under `accounts` is one target to audit. `name` labels it in the
    # report; add your own connection fields (server, token, context, ...) and
    # read them in internal/UnmarshalConfig.
    accounts:
      - name: "my-target"
        # server: "https://api.example.com"
        # token:  "${API_TOKEN}"
